name: Keep Supabase & MongoDB Alive

# Supabase free-tier projects pause after 7 days without any API traffic.
# This pings the deployed app's /api/health endpoint (which touches both
# Supabase Auth and MongoDB) every 3 days so neither backend goes idle.

on:
  schedule:
    - cron: "0 6 */3 * *" # every 3 days at 06:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          url="${{ vars.APP_URL || 'https://splitfree-zeta.vercel.app' }}/api/health"
          echo "Pinging $url"
          response=$(curl -sS -w "\n%{http_code}" "$url")
          body=$(echo "$response" | sed '$d')
          code=$(echo "$response" | tail -n1)
          echo "$body"
          if [ "$code" -ne 200 ]; then
            echo "Health check failed with HTTP $code"
            exit 1
          fi
